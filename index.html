<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutuido — Coming Soon</title>
  <meta name="description" content="Tutuido — ballet-themed hen parties. Coming soon.">
  <meta name="theme-color" content="#f7c6d9">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩰</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: "Didot", "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif;
      color: #4a2c3d;
      text-align: center;
      background: linear-gradient(135deg, #fde2ea 0%, #f7c6d9 30%, #e9c9f0 65%, #fbe3d4 100%);
      background-size: 300% 300%;
      animation: drift 18s ease-in-out infinite;
    }

    @keyframes drift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }

    main { max-width: 40rem; }

    .wordmark {
      margin: 0 0 1.5rem;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.45em;
      text-transform: lowercase;
      opacity: 0.75;
    }

    h1 {
      margin: 0 0 2rem;
      font-size: clamp(2.5rem, 9vw, 5rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.1;
    }

    .emoji { font-style: normal; white-space: nowrap; }

    a.email {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: clamp(1rem, 3vw, 1.15rem);
      letter-spacing: 0.04em;
      color: #4a2c3d;
      text-decoration: none;
      border: 1px solid rgba(74, 44, 61, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    a.email:hover,
    a.email:focus-visible {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(74, 44, 61, 0.6);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">tutuido</p>
    <h1>Coming Soon <span class="emoji" aria-hidden="true">🩰🍾</span></h1>
    <a class="email" href="mailto:info@tutuido.com">info@tutuido.com</a>
  </main>
</body>
</html>
